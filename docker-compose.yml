version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: timio
    ports:
      - "5432:5432"
    volumes:
      - timio_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/timio
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-production
      PORT: 8787
      # Модуль подписок (ЮKassa) - подставьте свои ключи из личного кабинета ЮKassa
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      SUBSCRIPTION_CRON_INTERVAL_MS: 3600000
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./web
    environment:
      # Браузер ходит на API через localhost (порт проброшен на хост),
      # даже если внутри docker-сети сервисы видят друг друга по имени.
      NUXT_PUBLIC_API_BASE: http://localhost:8787
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  timio_pg_data:
